    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ScoreKeeper by Ryan Parag" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Primary Meta Tags -->
    <title>ScoreKeeper by Ryan Parag</title>
    <meta name="title" content="ScoreKeeper by Ryan Parag" />
    <meta name="description" content="Add players and track scores across all your favorite card games" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://scorekeeper.ryanparag.com" />
    <meta property="og:title" content="ScoreKeeper by Ryan Parag" />
    <meta property="og:description" content="Add players and track scores across all your favorite card games" />
    <meta property="og:image" content="https://opengraph.b-cdn.net/production/images/c9cdf814-442e-4f47-8157-c5c9f30d3922.png?token=UY0rRGh_3xTSlzdBrPHWxmxSEGkN_nxvtfgZ16aoKlw&height=590&width=1200&expires=33298869727">

    <!-- X (Twitter) -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://scorekeeper.ryanparag.com" />
    <meta property="twitter:title" content="ScoreKeeper by Ryan Parag" />
    <meta property="twitter:description" content="Add players and track scores across all your favorite card games" />
    <meta property="twitter:image" content="https://opengraph.b-cdn.net/production/images/c9cdf814-442e-4f47-8157-c5c9f30d3922.png?token=UY0rRGh_3xTSlzdBrPHWxmxSEGkN_nxvtfgZ16aoKlw&height=590&width=1200&expires=33298869727" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ScoreKeeper",
        "url": "https://scorekeeper.ryanparag.com",
        "description": "Add players and track scores across all your favorite card and board games — live standings, win probability, leagues, and season stats.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any (Web)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HowTo",
        "name": "How to keep score with ScoreKeeper",
        "description": "Track scores for any card or board game in a few taps.",
        "step": [
          {
            "@type": "HowToStep",
            "name": "Start a new game",
            "text": "Name your game and choose how the leaderboard ranks players — highest or lowest score wins."
          },
          {
            "@type": "HowToStep",
            "name": "Add players",
            "text": "Add everyone at the table, each with their own name and color."
          },
          {
            "@type": "HowToStep",
            "name": "Enter scores each round",
            "text": "After every round, tap in each player's score — or say them out loud with voice entry."
          },
          {
            "@type": "HowToStep",
            "name": "Watch live standings",
            "text": "Rankings, point gaps, and live win probability update automatically as scores come in."
          },
          {
            "@type": "HowToStep",
            "name": "Finish and share",
            "text": "Complete the game to see final rankings, then share the results with your group."
          }
        ]
      }
    </script>

    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('card-game-scorer-settings') || '{}');
          var theme = s.theme || 'dark';
          var neutral = s.neutral || 'stone';
          if (theme === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-neutral', neutral);
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-neutral', 'stone');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
